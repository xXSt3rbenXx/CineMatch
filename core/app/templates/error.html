{% extends "base.html" %}

{# Pagina per gli errori (404, 500...): code, heading e text li sceglie app/errors.py #}
{% block content %}
  <section class="error-page">
    <p class="error-code">{{ code }}</p>
    <h2>{{ heading }}</h2>
    <p class="error-text">{{ text }}</p>
    <a href="/" class="pill-button">Back to home</a>
  </section>
{% endblock %}
