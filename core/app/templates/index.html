{% extends "base.html" %}

{% block content %}
  {% set user = get_current_user(request) %}
  {% if user %}
    <p>Welcome, {{ user["username"] }}.</p>
  {% else %}
    <p>Welcome to CineMatch. <a href="/login">Log in</a> or <a href="/register">register</a> to save your own watchlist.</p>
  {% endif %}
{% endblock %}
