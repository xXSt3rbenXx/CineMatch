{% extends "base.html" %}

{% block content %}
  <div class="auth-box">
    {# alt vuoto: il simbolo è decorativo, il titolo sotto dice già dove sei #}
    <img src="/static/img/simbolo.svg" alt="" class="auth-symbol">
    <h2>Log in</h2>

    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      {# Pagina dove tornare dopo il login #}
      <input type="hidden" name="next_url" value="{{ next_url }}">

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit" class="button-primary">Log in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="/register">Register</a></p>
  </div>
{% endblock %}
