{# Casella di ricerca riutilizzabile: scegliendo un suggerimento la pagina si ricarica con ?movie=id.
   Usa la variabile movie: il film scelto, o None #}

<div class="search">
  <input type="text" id="search" placeholder="Search a movie by title" autocomplete="off"
         value="{{ movie.title if movie else '' }}">
  {% if movie %}
    {# Senza JavaScript la X è un link che toglie ?movie=id; search.js la gestisce senza ricaricare #}
    <a href="{{ request.url.remove_query_params('movie') }}" class="clear" title="Clear">✕</a>
  {% endif %}
  <ul class="suggestions"></ul>
</div>
